# WebSocket-capable proxy for Blazor Server (xanthos.tugrul.net -> 127.0.0.1:5010)
#
# Hestia creates the domain and its nginx conf; Blazor Server additionally
# needs HTTP upgrade headers or the circuit silently fails. Apply this either
# as a custom Hestia proxy template (survives "rebuild") or directly in the
# generated conf. Verify the actual path on the server before editing:
#   /etc/nginx/conf.d/  and  /usr/local/hestia/data/users/<user>/conf/web/nginx/
#
# Keep agent (5011) and pipeline (5012) localhost-only: do NOT proxy them.

location / {
    proxy_pass         http://127.0.0.1:5010;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering    off;
}
